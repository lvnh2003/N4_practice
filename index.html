</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// Các file data gọi DAY(ngày, {v:[từ vựng], g:[ngữ pháp], r:[bài đọc]})
var DATA = {vocab: [], grammar: [], reading: []};
function DAY(d, o) {
  (o.v || []).forEach(function (x) { x.day = d; DATA.vocab.push(x); });
  (o.g || []).forEach(function (x) { x.day = d; DATA.grammar.push(x); });
  [].concat(o.r || []).forEach(function (x) { x.day = d; DATA.reading.push(x); });
}
</script>
